[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiproof"
version = "0.1.11"
description = "OS-wide AI text proofreader for GNOME/Wayland: select text anywhere, hit a hotkey, get it corrected in place"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Ed Watson", email = "edmundwatson@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "requests",
]

[project.scripts]
aiproof = "aiproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiproof = ["data/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "flow: fully-mocked flow route test (collected into build/flow-report.md)",
]
